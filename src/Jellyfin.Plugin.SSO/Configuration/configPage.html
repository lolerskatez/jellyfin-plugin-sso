<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Single Sign-On</title>
</head>
<body>
    <div id="SingleSignOnConfigPage"
         data-role="page"
         class="page type-interior pluginConfigurationPage sso-admin-page"
         data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div id="sso-admin-root">
                    <div class="sso-loading">Loading Single Sign-On settings…</div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var stylesheet = document.createElement('link');
                stylesheet.rel = 'stylesheet';
                stylesheet.href = '../sso/assets/admin.css';
                document.head.appendChild(stylesheet);

                var script = document.createElement('script');
                script.src = '../sso/assets/admin.js';
                document.head.appendChild(script);
            })();
        </script>
    </div>
</body>
</html>
