name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: |
          dotnet build Jellyfin.Plugin.SSO.sln -c Release
          dotnet test Jellyfin.Plugin.SSO.sln -c Release --no-build

      - name: Publish plugin
        run: dotnet publish src/Jellyfin.Plugin.SSO/Jellyfin.Plugin.SSO.csproj -c Release --no-build -o artifacts/plugin

      - name: Package plugin
        run: |
          python -m pip install --user jprm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jprm" plugin build . --output ./artifacts

      - name: Attach release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for zip in artifacts/*.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$zip" --clobber
          done

      - name: Update repository manifest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for zip in artifacts/*.zip; do
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$(basename "$zip")"
            jprm repo add --plugin-url "$url" ./manifest.json "$zip"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Publish plugin manifest"
          git push
