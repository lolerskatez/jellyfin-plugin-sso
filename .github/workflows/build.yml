name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish plugin
        run: dotnet publish src/Jellyfin.Plugin.SSO/Jellyfin.Plugin.SSO.csproj -c Release --no-build -o artifacts/plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.SSO
          path: artifacts/plugin
